{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Log In</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Login</button>
            </div>
        </form>
        <div class="border-top pt-3 d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="mb-2 mb-md-0 text-center text-md-left w-100">
                <small class="text-muted">Need an account? Create one to post and interact.</small>
            </div>
            <div class="w-100 text-center text-md-right">
                <a class="btn btn-outline-info" href="{% url 'register' %}">Sign Up Now</a>
            </div>
        </div>
    </div>
{% endblock content %}
