{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Log In</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group text-right">
                <button class="btn btn-outline-info" type="submit">Login</button>
            </div>
        </form>
        <div class="auth-footer border-top pt-3 mt-3">
            <div class="auth-footer__meta">
                <small class="text-muted">Need an account? Create one to post and interact.</small>
            </div>
            <div class="auth-footer__action">
                <a class="btn btn-outline-info" href="{% url 'register' %}">Sign Up Now</a>
            </div>
        </div>
    </div>
{% endblock content %}
